name: Go sensing backend

on:
  push:
    branches: [main, develop, 'feature/*', 'feat/*', 'hotfix/*']
    paths:
      - 'backend/**'
      - 'docker/docker-compose.yml'
      - '.github/workflows/go-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker/docker-compose.yml'
      - '.github/workflows/go-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: format · test · vet · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: |
          files=$(find . -name '*.go' -type f)
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module tidiness
        working-directory: backend
        run: go mod tidy -diff

      - name: Test with race detector
        working-directory: backend
        run: go test -race ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Verify modules
        working-directory: backend
        run: go mod verify

      - name: Build server
        working-directory: backend
        run: go build -trimpath -o "$RUNNER_TEMP/ruview-server" ./cmd/ruview-server

      - name: Build and smoke-test the default Compose service
        env:
          CSI_SOURCE: simulate
          RUVIEW_API_TOKEN: go-backend-ci-smoke-token
          RUVIEW_UDP_ALLOW: 127.0.0.1
          RUVIEW_UDP_PUBLISH_ADDR: 127.0.0.1
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.yml config --quiet
          trap 'docker compose -f docker/docker-compose.yml stop sensing-server >/dev/null' EXIT
          docker compose -f docker/docker-compose.yml up -d --build --wait --wait-timeout 90 sensing-server

          curl -fsS http://127.0.0.1:3000/health/live >/dev/null
          root_status=$(curl -sS -L -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          test "$root_status" = "200"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/info)
          test "$status" = "401"
          info=$(curl -fsS -H "Authorization: Bearer ${RUVIEW_API_TOKEN}" \
            http://127.0.0.1:3000/api/v1/info)
          printf '%s' "$info" | jq -e '.backend == "go" and .source == "simulate" and .features.person_localization == false and .features.calibrated_vitals == false' >/dev/null
