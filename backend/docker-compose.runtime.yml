services:
  go-sensing-server:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ruvnet/ruview-go-backend:migration
    ports:
      - "${RUVIEW_HTTP_PUBLISH_ADDR:-127.0.0.1}:3000:3000/tcp"
      - "${RUVIEW_WS_PUBLISH_ADDR:-127.0.0.1}:3001:3001/tcp"
      - "${RUVIEW_UDP_PUBLISH_ADDR:-0.0.0.0}:${RUVIEW_UDP_HOST_PORT:-5005}:5005/udp"
    environment:
      RUVIEW_API_TOKEN: "${RUVIEW_API_TOKEN:-}"
      RUVIEW_ALLOW_UNAUTHENTICATED: "${RUVIEW_ALLOW_UNAUTHENTICATED:-false}"
      RUVIEW_OAUTH_ISSUER: "${RUVIEW_OAUTH_ISSUER:-}"
      RUVIEW_OAUTH_JWKS_URL: "${RUVIEW_OAUTH_JWKS_URL:-}"
      RUVIEW_OAUTH_CLIENT_IDS: "${RUVIEW_OAUTH_CLIENT_IDS:-ruview}"
      RUVIEW_PUBLIC_BASE_URL: "${RUVIEW_PUBLIC_BASE_URL:-}"
      RUVIEW_SESSION_SECRET: "${RUVIEW_SESSION_SECRET:-}"
      RUVIEW_UDP_ALLOW: "${RUVIEW_UDP_ALLOW:?Set RUVIEW_UDP_ALLOW to the permitted UDP sender IP or CIDR}"
      CSI_SOURCE: "${CSI_SOURCE:-esp32}"
      RUVIEW_PRIVACY_MODE: "${RUVIEW_PRIVACY_MODE:-false}"
      RUVIEW_ACTIVITY_STATE: "${RUVIEW_ACTIVITY_STATE:-/app/data/activity-state.json}"
      # Experimental pose regression is opt-in; it is not accepted localization.
      RUVIEW_POSE_MODEL_PATH: "${RUVIEW_POSE_MODEL_PATH:-}"
      RUVIEW_POSE_NODE_ID: "${RUVIEW_POSE_NODE_ID:--1}"
      WDP_RUFIELD_SIGNING_SEED: "${WDP_RUFIELD_SIGNING_SEED:-}"
      RUVIEW_NO_MDNS: "${RUVIEW_NO_MDNS:-true}"
      RUVIEW_INSTALLATION_ID: "${RUVIEW_INSTALLATION_ID:-installation}"
      RUVIEW_INSTALLATION_NAME: "${RUVIEW_INSTALLATION_NAME:-RuView Installation}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_EXPORTER_OTLP_LOGS_HEADERS: "${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}"
      OTEL_EXPORTER_OTLP_TIMEOUT: "${OTEL_EXPORTER_OTLP_TIMEOUT:-}"
      OTEL_EXPORTER_OTLP_LOGS_TIMEOUT: "${OTEL_EXPORTER_OTLP_LOGS_TIMEOUT:-}"
      OTEL_EXPORTER_OTLP_INSECURE: "${OTEL_EXPORTER_OTLP_INSECURE:-}"
      OTEL_EXPORTER_OTLP_LOGS_INSECURE: "${OTEL_EXPORTER_OTLP_LOGS_INSECURE:-}"
      OTEL_EXPORTER_OTLP_CERTIFICATE: "${OTEL_EXPORTER_OTLP_CERTIFICATE:-}"
      OTEL_EXPORTER_OTLP_LOGS_CERTIFICATE: "${OTEL_EXPORTER_OTLP_LOGS_CERTIFICATE:-}"
      OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE: "${OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE:-}"
      OTEL_EXPORTER_OTLP_CLIENT_KEY: "${OTEL_EXPORTER_OTLP_CLIENT_KEY:-}"
      OTEL_EXPORTER_OTLP_LOGS_CLIENT_CERTIFICATE: "${OTEL_EXPORTER_OTLP_LOGS_CLIENT_CERTIFICATE:-}"
      OTEL_EXPORTER_OTLP_LOGS_CLIENT_KEY: "${OTEL_EXPORTER_OTLP_LOGS_CLIENT_KEY:-}"
      OTEL_EXPORTER_OTLP_COMPRESSION: "${OTEL_EXPORTER_OTLP_COMPRESSION:-}"
      OTEL_EXPORTER_OTLP_LOGS_COMPRESSION: "${OTEL_EXPORTER_OTLP_LOGS_COMPRESSION:-}"
      SENSING_ALLOWED_HOSTS: "${SENSING_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      SENSING_NODE_POSITIONS: "${SENSING_NODE_POSITIONS:-}"
      RUVIEW_MIST_SITE_ID: "${RUVIEW_MIST_SITE_ID:-}"
      RUVIEW_MIST_REGION: "${RUVIEW_MIST_REGION:-}"
      RUVIEW_MIST_TOKEN_ENV: "${RUVIEW_MIST_TOKEN_ENV:-MIST_API_TOKEN}"
      MIST_API_TOKEN: "${MIST_API_TOKEN:-}"
      RUVIEW_NETGEAR_LOCATION_ID: "${RUVIEW_NETGEAR_LOCATION_ID:-}"
      RUVIEW_NETGEAR_BASE_URL: "${RUVIEW_NETGEAR_BASE_URL:-}"
      RUVIEW_NETGEAR_CLIENTS_PATH: "${RUVIEW_NETGEAR_CLIENTS_PATH:-}"
      RUVIEW_NETGEAR_TOKEN_ENV: "${RUVIEW_NETGEAR_TOKEN_ENV:-NETGEAR_INSIGHT_TOKEN}"
      NETGEAR_INSIGHT_TOKEN: "${NETGEAR_INSIGHT_TOKEN:-}"
      RUVIEW_ORIGIN_AI_BASE_URL: "${RUVIEW_ORIGIN_AI_BASE_URL:-}"
      RUVIEW_ORIGIN_AI_EVENTS_PATH: "${RUVIEW_ORIGIN_AI_EVENTS_PATH:-}"
      RUVIEW_ORIGIN_AI_TOKEN_ENV: "${RUVIEW_ORIGIN_AI_TOKEN_ENV:-}"
      ORIGIN_AI_TOKEN: "${ORIGIN_AI_TOKEN:-}"
      RUVIEW_PLUME_BASE_URL: "${RUVIEW_PLUME_BASE_URL:-}"
      RUVIEW_PLUME_EVENTS_PATH: "${RUVIEW_PLUME_EVENTS_PATH:-}"
      RUVIEW_PLUME_TOKEN_ENV: "${RUVIEW_PLUME_TOKEN_ENV:-}"
      PLUME_API_TOKEN: "${PLUME_API_TOKEN:-}"
      RUVIEW_VENDOR_POLL_SECS: "${RUVIEW_VENDOR_POLL_SECS:-60}"
      RUVIEW_MQTT: "${RUVIEW_MQTT:-false}"
      RUVIEW_MQTT_HOST: "${RUVIEW_MQTT_HOST:-localhost}"
      RUVIEW_MQTT_PORT: "${RUVIEW_MQTT_PORT:-}"
      RUVIEW_MQTT_USERNAME: "${RUVIEW_MQTT_USERNAME:-}"
      RUVIEW_MQTT_PASSWORD_ENV: "${RUVIEW_MQTT_PASSWORD_ENV:-MQTT_PASSWORD}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      RUVIEW_MQTT_CLIENT_ID: "${RUVIEW_MQTT_CLIENT_ID:-}"
      RUVIEW_MQTT_PREFIX: "${RUVIEW_MQTT_PREFIX:-homeassistant}"
      RUVIEW_MQTT_TLS: "${RUVIEW_MQTT_TLS:-false}"
      RUVIEW_MQTT_CA_FILE: "${RUVIEW_MQTT_CA_FILE:-}"
      RUVIEW_MQTT_CLIENT_CERT: "${RUVIEW_MQTT_CLIENT_CERT:-}"
      RUVIEW_MQTT_CLIENT_KEY: "${RUVIEW_MQTT_CLIENT_KEY:-}"
      RUVIEW_MQTT_REFRESH_SECS: "${RUVIEW_MQTT_REFRESH_SECS:-600}"
      RUVIEW_MQTT_RSSI_SECS: "${RUVIEW_MQTT_RSSI_SECS:-10}"
    volumes:
      - go-backend-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

volumes:
  go-backend-data:
