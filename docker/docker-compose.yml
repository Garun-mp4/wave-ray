services:
  # Go is the default sensing server. Its shared runtime configuration lives
  # with the Go image, so local and top-level Compose runs use the same settings.
  sensing-server:
    extends:
      file: ../backend/docker-compose.runtime.yml
      service: go-sensing-server

  # The Python reference server remains available only for explicit legacy
  # comparisons; normal `docker compose up` starts one sensing backend.
  python-sensing:
    profiles: [legacy-python]
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: ruvnet/wifi-densepose:python
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  go-backend-data:
